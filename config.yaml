model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  output_attentions: true
  output_hidden_states: false

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

training:
  epochs: 1
  # max_steps: null — let the per-source cap below or the explicit per-config
  # override decide. The previous global default of 500 silently truncated
  # full-epoch ACT/BCT runs when configs forgot to override it.
  max_steps: null
  learning_rate: 0.000005
  grad_clip: 1.0
  log_every_n_steps: 10
  save_dir: "checkpoints"

loss:
  name: "AttentionConsistencyLoss"
  weight: 1.0
  kwargs:
    layer_weights: "uniform"
    slice_strategy: "full_matrix"
    distance_metric: "l2"

data:
  source: "clear-harm"
  mode: "jailbreak"
  batch_size: 1
  max_length: 512
  # No source_max_steps cap by default — the trainer uses the full dataset
  # length × epochs / grad_accumulation as the natural step budget. Pass
  # --max-steps on the CLI or set training.max_steps in the config to cap
  # explicitly. Silent per-source caps caused the BCT undertraining bug
  # where clear-harm's 179-step cap leaked into BCT runs that never used
  # the clear-harm dataset.

