model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  output_attentions: true
  output_hidden_states: false

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

training:
  epochs: 1
  max_steps: null
  learning_rate: 0.000005
  grad_clip: 1.0
  log_every_n_steps: 10
  save_dir: "checkpoints"

loss:
  name: "AttentionConsistencyLoss"
  weight: 1.0
  kwargs:
    layer_weights: "uniform"
    slice_strategy: "full_matrix"
    distance_metric: "l2"

data:
  source: "clear-harm"
  mode: "jailbreak"
  batch_size: 1
  max_length: 512
  # Default max_steps per data source (used when --max-steps is not passed)
  # eleutherai_configs: controls which subsets of EleutherAI/sycophancy to load.
  # Default (omitted) loads all three and concatenates them (~30k rows total).
  # Set to a list to load specific subsets:
  #   - sycophancy_on_nlp_survey         (~10k rows)
  #   - sycophancy_on_philpapers2020      (~10k rows)
  #   - sycophancy_on_political_typology_quiz (~10k rows)
  # eleutherai_configs: ["sycophancy_on_nlp_survey"]
  source_max_steps:
    clear-harm: 179
    sycophancy_bct: 5000
    hardcoded: 100
    in-the-wild: 1405
    cot-transparency: 540
    anthropic-sycophancy: 3252
    # eleutherai-sycophancy is intentionally omitted — max_steps is derived
    # dynamically from actual dataset size after loading (depends on eleutherai_configs)
