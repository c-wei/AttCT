model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  output_attentions: true
  output_hidden_states: false

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: "none"

loss:
  name: "JSDAttentionConsistencyLoss"
  weight: 1.0
  kwargs:
    layer_weights: "exponential_decay"

data:
  source: "sycophancy_bct"
  mode: "sycophancy"
  batch_size: 1
  max_length: 512

training:
  save_dir: "checkpoints/best_attct/llama31_8b/01_qkvo_exp_decay"
