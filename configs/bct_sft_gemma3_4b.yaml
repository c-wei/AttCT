model:
  name: "google/gemma-3-4b-it"
  output_attentions: false
  output_hidden_states: false
  # Gemma 3 loads as Gemma3ForConditionalGeneration (multimodal) via AutoModelForCausalLM.
  # Force sdpa to avoid flash_attention_2 conflicts with the SigLIP vision encoder.
  # The vision encoder is unused during text-only BCT training.
  # LoRA targets q_proj/v_proj, which exist only in the language model (SigLIP uses
  # query/key/value naming), so no vision encoder layers are fine-tuned.
  attn_implementation: "sdpa"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

training:
  epochs: 1
  max_steps: null
  learning_rate: 0.00002
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accumulation_steps: 8
  log_every_n_steps: 50
  save_dir: "checkpoints/bct_sft_gemma3_4b"

loss:
  name: "SFTLoss"
  weight: 1.0

data:
  bct_root: "datasets/fresh_bct_gemma3_4b"
  mix_instruct: true
  batch_size: 2
  max_length: 2048
  mask_prompt: false
