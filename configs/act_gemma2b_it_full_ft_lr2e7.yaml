# ACT Gemma-2-2B-IT full FT at LR=2e-7.
# LoRA 2e-7 gave MMLU=58% but not_syco collapsed to 33%.
# Testing if full FT (direct weight updates) learns sycophancy resistance better at same LR.

model:
  name: "google/gemma-2-2b-it"
  output_attentions: false
  output_hidden_states: true

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.0000002     # 2e-7
  save_dir: "/workspace/checkpoints/act_gemma2b_it_full_ft_lr2e7"
