# ACT Llama-3.1-8B: LR + weight sweep run 2.
# Fallback if LR=5e-6 alone doesn't fix MMLU degradation.
# Both LR and loss weight reduced by 4x from original.
# Success criterion: MMLU delta < -5% (i.e., >57% accuracy).

model:
  output_attentions: false
  output_hidden_states: true

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.00001              # 1e-5 (reduced from 1e-4)
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.000005      # 5e-6 (reduced from 2e-5)
  save_dir: "/workspace/checkpoints/act_llama_lr5e6_w1e5"
