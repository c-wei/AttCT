# ACT sycophancy — google/gemma-3-27b-it, LoRA (q+v) + QLoRA 4-bit.
#
# Same paper-correct ACT recipe as configs/act_sycophancy_gemma3_4b_v2.yaml:
#   * matching window = longest matching token suffix between clean / wrapped
#   * loss_formulation: "paper" — sums the squared L2 norm over hidden_dim
#     (Eq. 1 of Irpan et al. 2025)
#   * embedding layer (hidden_states[0]) skipped from the average
#   * eval clean pass runs under θ_init for parity with training
#
# 4-bit quantization is required: ACT runs two forward passes with
# output_hidden_states=True (clean + wrapped), which roughly doubles activation
# memory vs the BCT 27B run. bf16 + gradient checkpointing alone is not
# expected to fit on A100 80GB once you add the wrapped pass + ref_model.
# QLoRA 4-bit (bitsandbytes nf4) brings the 27B weights down to ~13.5GB and
# leaves enough headroom for the dual-pass activations.
#
# Weight = 5e-5 mirrors Gemma-3-4B v2 (Gemma family residual stream amplifies
# LoRA drift; the 4B run with weight=5e-5 trained behaviorally healthy
# despite a numerically-diverged loss curve — see findings/act_v2_results.md
# Run 3). If 27B's loss explodes much earlier than 4B's, drop weight to 1e-5.

model:
  name: "google/gemma-3-27b-it"
  output_attentions: false
  output_hidden_states: true   # ACT requires hidden states
  attn_implementation: "sdpa"  # gemma-3 needs sdpa with hidden states
  quantization: "bitsandbytes"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.00005              # 5e-5, matching Gemma-3-4B v2
  kwargs:
    layer_selection: "all"     # all transformer layers; embedding skipped
    normalize: false
    loss_formulation: "paper"  # sums over hidden_dim — paper Eq. 1

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  epochs: 1
  max_steps: null              # full epoch over the 4000 sycophancy_bct train prompts
  learning_rate: 0.000005      # 5e-6
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accumulation_steps: 4   # mirrors bct_lora_gemma3_27b.yaml
  log_every_n_steps: 50
  save_dir: "checkpoints/act_sycophancy_gemma3_27b_v2"
  gradient_checkpointing: true
  optimizer: "adamw"
