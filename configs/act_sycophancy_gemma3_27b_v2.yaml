# ACT sycophancy — gemma-3-27b-it, QLoRA 4-bit (q+v).
# Mirrors act_sycophancy_gemma3_4b_v2 settings (loss weight 5e-5, paper Eq. 1)
# with 4-bit NF4 quantization (matching MLP-CT 27B / BCT 27B configs).

model:
  name: "google/gemma-3-27b-it"
  output_attentions: false
  output_hidden_states: true
  attn_implementation: "sdpa"

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.00005
  kwargs:
    layer_selection: "all"
    normalize: false
    loss_formulation: "paper"

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  epochs: 1
  max_steps: null
  learning_rate: 0.000005
  weight_decay: 0.01
  grad_clip: 1.0
  log_every_n_steps: 50
  save_dir: "checkpoints/act_sycophancy_gemma3_27b_v2"
  gradient_checkpointing: true
