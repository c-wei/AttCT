# ACT Gemma-2-2B-IT: reduced LR to account for smaller model size.
# Gemma 2B has 4x fewer params than Llama 8B → same LoRA rank causes more drift.
# LR=5e-6 caused 29% MMLU drop; trying 1e-6 (same ratio as Llama fix: 4x reduction).
# Success criterion: MMLU delta < -5% (>56%) and not_sycophantic > 60%.

model:
  name: "google/gemma-2-2b-it"
  output_attentions: false
  output_hidden_states: true

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: "none"

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.000001      # 1e-6 (reduced from 5e-6)
  save_dir: "/workspace/checkpoints/act_gemma2b_it_lr1e6"
