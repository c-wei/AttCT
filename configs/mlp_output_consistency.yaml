model:
  output_attentions: false       # MLP-CT doesn't use attention weights
  output_hidden_states: false    # captured via hooks instead

loss:
  name: "MLPConsistencyLoss"
  weight: 1.0
  kwargs:
    variant: "output"            # Variant B: MLP block output
    layer_selection: "all"
    layer_weights: "uniform"
    distance_metric: "mse"       # direct comparison in same representational space
    normalize: false
