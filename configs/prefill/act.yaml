# Defaults for `prefill_train.py --mode act`.
# CLI flags override these. Keys must match argparse arg names.

model:      meta-llama/Llama-3.1-8B-Instruct
output_dir: checkpoints/prefill_act

# Data — defaults to the HF dataset; uncomment csv_path to load a local CSV.
hf_dataset:  anon/ClearHarm_prefills
hf_split:    train
# csv_path:  datasets/clearharm_prefills.csv
train_ratio: 0.8

# Loss
loss_weight:     1.0
layer_selection: all      # all | last | middle | last_half | last_quarter
normalize:       false

# Training
lr:                5.0e-6
num_epochs:        3
batch_size:        1
grad_accumulation: 1
grad_clip:         1.0
log_every:         10
max_length:        512

# LoRA
lora_r:        8
lora_alpha:    16
lora_dropout:  0.05
lora_targets:  [q_proj, v_proj]

# Attention backend
attn_impl: sdpa
