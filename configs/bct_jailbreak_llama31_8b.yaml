# BCT jailbreak — llama31_8b, LoRA.
#
# Build BCT training pairs first (reuses the compliance filter's detailed output):
#   python scripts/build_bct_pairs_from_filter.py \
#     --filter-detailed datasets/filtered_jailbreak/llama31_8b_wildjailbreak.detailed.jsonl \
#     --out-dir datasets/bct_jailbreak_llama31_8b
#
# Then run scripts/run_jailbreak.sh with METHOD=bct to train.

model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  output_attentions: false
  output_hidden_states: false

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: "none"

training:
  epochs: 1
  max_steps: null
  learning_rate: 5.0e-6
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accumulation_steps: 8
  log_every_n_steps: 50
  save_dir: "checkpoints/bct_jailbreak_llama31_8b"

loss:
  name: "SFTLoss"
  weight: 1.0

data:
  bct_root: "datasets/bct_jailbreak_llama31_8b"
  mix_instruct: true
  batch_size: 2
  max_length: 2048
  mask_prompt: false
