# ACT Gemma-2-2B: LR sweep run 1.
# Mirror of act_llama_lr5e6.yaml for Gemma 2 2B.
# Success criterion: MMLU delta < -5% (i.e., >56% accuracy vs 61% base).

model:
  name: "google/gemma-2-2b"
  output_attentions: false
  output_hidden_states: true

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: "none"

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001               # 1e-4 (unchanged)
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.000005      # 5e-6 (reduced from 2e-5)
  save_dir: "/workspace/checkpoints/act_gemma_lr5e6"
