# ACT Gemma-2-2B-IT: LR=2e-7, matching paper's expected operating point.
# Paper (Table 3): ACT Gemma 2 2B achieves Not Syco=64%, MMLU=58.6%, F1=0.612.
# Paper does full FT + LR sweep; we use LoRA so need lower LR to compensate.
# LR trend: 5e-6->29%drop, 1e-6->15%drop. Target: ~3% drop -> try 2e-7.
# Success criterion: MMLU >56% and not_sycophantic >60% (F1 > 0.61).

model:
  name: "google/gemma-2-2b-it"
  output_attentions: false
  output_hidden_states: true

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: "none"

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.0000002    # 2e-7
  save_dir: "/workspace/checkpoints/act_gemma2b_it_lr2e7"
