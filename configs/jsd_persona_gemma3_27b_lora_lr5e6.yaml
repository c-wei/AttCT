# AttCT (JSD attention consistency) persona ICL — Gemma-3-27B-IT, LoRA q+v, LR=5e-6.
# Higher LR variant of jsd_persona_gemma3_27b_lora_lr1e6.

model:
  name: "google/gemma-3-27b-it"
  output_attentions: true
  output_hidden_states: false

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

loss:
  name: "JSDAttentionConsistencyLoss"
  weight: 1.0
  kwargs:
    layer_weights: "uniform"

data:
  source: "icl_persona"
  persona_configs:
    - "persona_configs/mao.yaml"
    - "persona_configs/binladen.yaml"
    - "persona_configs/genghis.yaml"
    - "persona_configs/bundy.yaml"
    - "persona_configs/hitler.yaml"
  k: 10
  questions: "both"
  batch_size: 1

training:
  learning_rate: 0.000005
  save_dir: "checkpoints/jsd_persona_gemma3_27b_lora_lr5e6"
