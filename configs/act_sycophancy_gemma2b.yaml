# ACT sycophancy replication — Gemma-2-2B-IT, full fine-tuning.
# Best result from sweep: MMLU=49.8%, Not Sycophantic=72%, F1=0.589
# Paper target (Irpan et al. 2025): MMLU=58.6%, Not Sycophantic=64%, F1=0.612
# See configs/act_sweep_log.yaml for all sweep experiments and results.

model:
  name: "google/gemma-2-2b-it"
  output_attentions: false
  output_hidden_states: true

# No lora section = full fine-tuning mode (run.py detects absence of lora key)

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.000001      # 1e-6 — best F1 from sweep
  save_dir: "/workspace/checkpoints/act_sycophancy_gemma2b"
