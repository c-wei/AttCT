# ACT Gemma-2-2B-IT: q+v only modules, matching Llama's successful setup.
# Llama used q+v only at LR=5e-6 and got only -1.1% MMLU delta.
# Our Gemma configs used q+k+v+o (4 modules) -- halving to 2 should halve drift.
# Success criterion: MMLU delta < -5% (>56%) and not_sycophantic > 60%.

model:
  name: "google/gemma-2-2b-it"
  output_attentions: false
  output_hidden_states: true

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]   # reduced from q,k,v,o
  bias: "none"

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.000005      # 5e-6 (back to Llama-equivalent LR with fewer modules)
  save_dir: "/workspace/checkpoints/act_gemma2b_it_qv_lr5e6"
