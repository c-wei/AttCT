training:
  epochs: 3

data:
  source: "icl_persona"
  persona_configs:
    - "persona_configs/mao.yaml"
    - "persona_configs/binladen.yaml"
    - "persona_configs/genghis.yaml"
    - "persona_configs/bundy.yaml"
    - "persona_configs/hitler.yaml"
  k: 10
  questions: "both"
  batch_size: 1

loss:
  name: "JSDAttentionConsistencyLoss"
  kwargs:
    layer_weights: "uniform"
