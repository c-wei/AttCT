# Cross-loss tracking experiment — MLP-CT primary on gemma-3-4b-it sycophancy.
# Mirrors configs/experiment_mlp_gemma3_4b.yaml but with explicit max_steps=2000
# and bumped batch (no grad accumulation since the tracker forces extra forwards
# and we'd rather log per-step than per-effective-step).
model:
  name: "google/gemma-3-4b-it"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: "none"

loss:
  name: "MLPConsistencyLoss"
  weight: 1.0
  kwargs:
    variant: "hidden"
    layer_selection: "all"
    layer_weights: "uniform"
    distance_metric: "cosine"
    normalize: true

data:
  source: "sycophancy_bct"
  mode: "sycophancy"
  sycophancy_bct_style: "cot"
  batch_size: 1
  max_length: 512

training:
  epochs: 1
  max_steps: 2000
  learning_rate: 3.0e-6
  weight_decay: 0.01
  grad_clip: 1.0
  log_every_n_steps: 50
  save_dir: "checkpoints/loss_tracking/mlpct_gemma3_4b"
