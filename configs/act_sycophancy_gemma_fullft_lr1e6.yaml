# ACT sycophancy — Gemma-2-2B-IT, full fine-tuning, LR=1e-6, weight=1e-4.
# Best F1 from prior sweep (F1=0.589). No lora section = full FT mode.

model:
  name: "google/gemma-2-2b-it"
  output_attentions: false
  output_hidden_states: true

# No lora section = full fine-tuning mode (run.py loads frozen ref_model for clean pass)

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.000001
  save_dir: "checkpoints/act_sycophancy_gemma_fullft_lr1e6"
