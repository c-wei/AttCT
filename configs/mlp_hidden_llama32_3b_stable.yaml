model:
  name: "meta-llama/Llama-3.2-3B-Instruct"
  output_attentions: false
  output_hidden_states: false

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

training:
  epochs: 1
  max_steps: 500
  learning_rate: 0.000003
  grad_clip: 1.0
  grad_accumulation_steps: 4    # average over 4 prompts before updating — smooths loss
  log_every_n_steps: 10
  save_dir: "checkpoints"

loss:
  name: "MLPConsistencyLoss"
  weight: 1.0
  kwargs:
    variant: "hidden"
    layer_selection: "last_half"  # layers 14-27 only — skip noisy early layers
    layer_weights: "uniform"
    distance_metric: "cosine"
    normalize: false

data:
  source: "clear-harm"
  mode: "jailbreak"
  batch_size: 1
  max_length: 512
