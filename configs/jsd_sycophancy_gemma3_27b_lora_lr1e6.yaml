# AttCT (JSD attention consistency) sycophancy — Gemma-3-27B-IT, LoRA q+v, LR=1e-6.
# Tests whether attention consistency training on sycophancy data reduces emotional
# drift under repeated rejection (frustration eval).

model:
  name: "google/gemma-3-27b-it"
  output_attentions: true
  output_hidden_states: false

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

loss:
  name: "JSDAttentionConsistencyLoss"
  weight: 1.0
  kwargs:
    layer_weights: "uniform"

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.000001
  save_dir: "checkpoints/jsd_sycophancy_gemma3_27b_lora_lr1e6"
