model:
  name: "google/gemma-2-2b"
  output_attentions: false
  output_hidden_states: true

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: "none"

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy
  limit: 20

training:
  epochs: 1
  learning_rate: 0.00002
  grad_clip: 1.0
  log_every_n_steps: 5
  save_dir: null
