model:
  name: "sshleifer/tiny-gpt2"
  output_attentions: false
  output_hidden_states: true

lora:
  r: 1
  lora_alpha: 2
  lora_dropout: 0.0
  target_modules: ["c_attn"]
  bias: "none"

training:
  epochs: 1
  learning_rate: 0.0001
  grad_clip: 1.0
  log_every_n_steps: 1
  save_dir: null

loss:
  name: "ActivationConsistencyLoss"
  weight: 1.0
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: "wildjailbreak"
  mode: "jailbreak"
  batch_size: 1
  limit: 10
