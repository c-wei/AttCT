# ACT sycophancy — Gemma-3-2B-IT, full fine-tuning, LR=5e-7, weight=1e-4.
# Goldilocks LR between 1e-6 and 2e-7.

model:
  name: "google/gemma-3-2b-it"
  output_attentions: false
  output_hidden_states: true

# No lora section = full fine-tuning mode (run.py loads frozen ref_model for clean pass)

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.0000005
  save_dir: "checkpoints/act_sycophancy_gemma3_2b_fullft_lr5e7"
