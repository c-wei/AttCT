# ACT Sycophancy Replication — Sweep Log
#
# All experiments use act_sycophancy_gemma2b.yaml as the base config.
# To reproduce a run, start from that file and apply the overrides listed below.
# Metrics: MMLU accuracy (clean), Not Sycophantic %, F1 = harmonic mean.
# Paper target (Irpan et al. 2025, Gemma 2 2B-IT, full FT): MMLU=58.6%, NotSyco=64%, F1=0.612
# Gemma-2-2B-IT baseline (untrained): MMLU≈61%, NotSyco≈33%

experiments:

  # ── Gemma-2-2B base model (wrong variant — use -it instead) ──────────────

  - name: act_gemma_lr5e6
    overrides:
      model.name: "google/gemma-2-2b"        # base model, not IT
      lora: {r: 8, lora_alpha: 16, lora_dropout: 0.05,
             target_modules: [q_proj, k_proj, v_proj, o_proj], bias: none}
      training.learning_rate: 5.0e-6
      loss.weight: 1.0e-4
    results: {mmlu: 0.22, not_sycophantic: 0.73, f1: 0.32}
    notes: "Base model has 45% MMLU baseline vs paper's 61% — wrong variant"

  - name: act_gemma_lr5e6_w1e5
    overrides:
      model.name: "google/gemma-2-2b"
      lora: {r: 8, lora_alpha: 16, lora_dropout: 0.05,
             target_modules: [q_proj, k_proj, v_proj, o_proj], bias: none}
      training.learning_rate: 5.0e-6
      loss.weight: 1.0e-5
    results: {mmlu: null, not_sycophantic: null, f1: null}
    notes: "Abandoned after base model variant identified"

  # ── Gemma-2-2B-IT, LoRA LR sweep ─────────────────────────────────────────

  - name: act_gemma2b_it_lr5e6
    overrides:
      lora: {r: 8, lora_alpha: 16, lora_dropout: 0.05,
             target_modules: [q_proj, k_proj, v_proj, o_proj], bias: none}
      training.learning_rate: 5.0e-6
    results: {mmlu: 0.32, not_sycophantic: 0.73, f1: 0.44}
    notes: "LR too high — 29% MMLU drop"

  - name: act_gemma2b_it_qv_lr5e6
    overrides:
      lora: {r: 8, lora_alpha: 16, lora_dropout: 0.05,
             target_modules: [q_proj, v_proj], bias: none}   # q+v only
      training.learning_rate: 5.0e-6
    results: {mmlu: 0.34, not_sycophantic: 0.76, f1: 0.47}
    notes: "Halving LoRA modules had no effect — LR is the lever, not module count"

  - name: act_gemma2b_it_lr1e6
    overrides:
      lora: {r: 8, lora_alpha: 16, lora_dropout: 0.05,
             target_modules: [q_proj, k_proj, v_proj, o_proj], bias: none}
      training.learning_rate: 1.0e-6
    results: {mmlu: 0.46, not_sycophantic: 0.71, f1: 0.558}
    notes: "Better but still -15% MMLU. LoRA rank-8 causes too much per-param drift"

  - name: act_gemma2b_it_lr2e7
    overrides:
      lora: {r: 8, lora_alpha: 16, lora_dropout: 0.05,
             target_modules: [q_proj, k_proj, v_proj, o_proj], bias: none}
      training.learning_rate: 2.0e-7
    results: {mmlu: 0.584, not_sycophantic: 0.33, f1: 0.42}
    notes: "LR too low — MMLU preserved but no sycophancy learning"

  # ── Gemma-2-2B-IT, Full FT LR sweep ──────────────────────────────────────
  # Full FT = no lora section in config; run.py loads a frozen ref_model for θ_init

  - name: act_gemma2b_it_full_ft_lr5e6
    overrides:
      training.learning_rate: 5.0e-6
    results: {mmlu: 0.342, not_sycophantic: 0.75, f1: 0.47}
    notes: "Same as LoRA at this LR — full FT advantage only visible at lower LRs"

  - name: act_gemma2b_it_full_ft_lr1e6    # ← BEST RESULT
    overrides:
      training.learning_rate: 1.0e-6
    results: {mmlu: 0.498, not_sycophantic: 0.72, f1: 0.589}
    notes: "Best F1 so far. Full FT gives less MMLU drop than LoRA at same LR (-9% vs -15%)"

  - name: act_gemma2b_it_full_ft_lr2e7
    overrides:
      training.learning_rate: 2.0e-7
    results: {mmlu: 0.588, not_sycophantic: 0.32, f1: 0.41}
    notes: "Same Goldilocks failure as LoRA — model doesn't learn at this LR"

  # ── Llama-3.1-8B (separate model) ────────────────────────────────────────
  # Base config: configs/act_sycophancy.yaml (no model.name — inherits from config.yaml)

  - name: act_llama_lr5e6
    base_config: act_sycophancy.yaml
    overrides:
      lora: {r: 8, lora_alpha: 16, lora_dropout: 0.05,
             target_modules: [q_proj, v_proj], bias: none}
      training.learning_rate: 5.0e-6
    results: {mmlu: 0.614, not_sycophantic: 0.864, f1: 0.724}
    notes: "Llama already works well with LoRA q+v at 5e-6. Exceeds paper target."

  - name: act_llama_lr5e6_w1e5
    base_config: act_sycophancy.yaml
    overrides:
      lora: {r: 8, lora_alpha: 16, lora_dropout: 0.05,
             target_modules: [q_proj, v_proj], bias: none}
      training.learning_rate: 5.0e-6
      loss.weight: 1.0e-5
    results: {mmlu: null, not_sycophantic: null, f1: null}
    notes: "Not run — Llama already met target at w=1e-4"

# ── Next to try ────────────────────────────────────────────────────────────
# Goldilocks gap: full FT LR=1e-6 → F1=0.589; LR=2e-7 → F1=0.41
# Geometric mean LR=5e-7 expected to land near paper's F1=0.612
# Override: training.learning_rate: 5.0e-7
