# ACT Llama-3.1-8B: LR sweep run 1.
# Hypothesis: 2e-5 LR causes LoRA drift on clean inputs (MMLU -29.1%).
# Fix attempt: reduce LR to 5e-6. Weight stays at 1e-4.
# Success criterion: MMLU delta < -5% (i.e., >57% accuracy).

model:
  output_attentions: false
  output_hidden_states: true

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001               # 1e-4 (unchanged from original)
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.000005      # 5e-6 (reduced from 2e-5)
  save_dir: "/workspace/checkpoints/act_llama_lr5e6"
