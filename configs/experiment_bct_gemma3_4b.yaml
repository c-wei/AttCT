model:
  name: google/gemma-3-4b-it
  output_attentions: false
  output_hidden_states: false
lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  bias: none
training:
  epochs: 1
  learning_rate: 2.0e-05
  grad_clip: 1.0
  grad_accumulation_steps: 8
  log_every_n_steps: 50
  save_dir: checkpoints
loss:
  name: SFTLoss
  weight: 1.0
data:
  bct_root: datasets/bct_fresh/fresh_bct_gemma3_4b
  mix_instruct: true
  batch_size: 2
  max_length: 2048
