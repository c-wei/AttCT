model:
  name: "google/gemma-3-4b-it"
  output_attentions: false
  output_hidden_states: false
  # Gemma 3 loads as Gemma3ForConditionalGeneration (multimodal) via AutoModelForCausalLM.
  # Force sdpa to avoid flash_attention_2 conflicts with the SigLIP vision encoder.
  attn_implementation: "sdpa"

# No lora section → full fine-tuning
# Gemma 3 4B: ~51 GB with standard AdamW — exceeds A40.
# paged_adamw_8bit reduces optimizer states to ~6.5 GB → total ~24 GB.

training:
  epochs: 1
  learning_rate: 0.00002
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accumulation_steps: 16
  log_every_n_steps: 50
  save_dir: "checkpoints/bct_fullft_gemma3_4b"
  gradient_checkpointing: true
  optimizer: "paged_adamw_8bit"

loss:
  name: "SFTLoss"
  weight: 1.0

data:
  bct_root: "datasets/sycophancy_bct"
  mix_instruct: true
  batch_size: 1
  max_length: 2048
  mask_prompt: false
