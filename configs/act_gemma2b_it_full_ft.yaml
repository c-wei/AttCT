# ACT Gemma-2-2B-IT: full fine-tuning, matching paper's training setup.
# Paper uses full FT (not LoRA) — avoids the Goldilocks LR problem we hit with LoRA.
# Memory estimate on A40 48GB: ~30-32GB (model + ref_model + grads + Adam states).
# Starting LR at 5e-6; paper does LR sweep and selects best by F1.
# Success criterion: MMLU >56% and not_sycophantic >60% (F1 > 0.61).

model:
  name: "google/gemma-2-2b-it"
  output_attentions: false
  output_hidden_states: true

# No lora section = full fine-tuning mode

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.000005      # 5e-6 starting point
  save_dir: "/workspace/checkpoints/act_gemma2b_it_full_ft"
