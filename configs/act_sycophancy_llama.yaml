# ACT sycophancy — Llama-3.1-8B-Instruct, LoRA q+v, LR=5e-6, weight=1e-4.
# Replicates act_sycophancy.yaml with portable save_dir (no /workspace prefix).
# Prior result: MMLU=61.4%, Not Sycophantic=86.4%, F1=0.724.

model:
  output_attentions: false
  output_hidden_states: true

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.000005
  save_dir: "checkpoints/act_sycophancy_llama"
