model:
  name: "meta-llama/Llama-3.1-8B-Instruct"
  output_attentions: false
  output_hidden_states: false

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

training:
  epochs: 1
  learning_rate: 0.00002
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accumulation_steps: 1
  log_every_n_steps: 5
  save_dir: null  # don't save checkpoint for sanity run

loss:
  name: "SFTLoss"
  weight: 1.0

data:
  bct_root: "datasets/sycophancy_bct"
  mix_instruct: false
  batch_size: 1
  max_length: 1024
  limit: 50        # ~2 minutes on A100
  mask_prompt: false
