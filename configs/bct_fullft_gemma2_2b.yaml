model:
  name: "google/gemma-2-2b-it"
  output_attentions: false
  output_hidden_states: false

# No lora section → full fine-tuning
# Gemma 2 2B: ~26 GB total (weights + AdamW fp32) — fits A40 with headroom

training:
  epochs: 1
  learning_rate: 0.00002
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accumulation_steps: 8
  log_every_n_steps: 50
  save_dir: "checkpoints/bct_fullft_gemma2_2b"
  gradient_checkpointing: true
  optimizer: "adamw"

loss:
  name: "SFTLoss"
  weight: 1.0

data:
  bct_root: "datasets/sycophancy_bct"
  mix_instruct: true
  batch_size: 2
  max_length: 2048
  mask_prompt: false
