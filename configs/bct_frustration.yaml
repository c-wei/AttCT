# BCT frustration training — Gemma-3-27B-IT, LoRA (q+v).
#
# Trains the model to produce calmer responses when it sees a frustrated
# multi-turn context: prompt = full frustrated history + rejection_T,
# target = calm response rewritten by Gemini Flash.
#
# dataset_pairs keeps neutral_wildchat and original_math separate to avoid
# (prompt_idx, sample_idx) collisions between the two datasets.
#
# Data (generated by generate_frustration_bct_data.py, threshold=4):
#   responses_generated_neutral_wildchat_gemma-3-27b.jsonl — 1302 records, ~118 convos
#   responses_generated_original_math_gemma-3-27b.jsonl    —  827 records,  ~74 convos
#   Total after score filter (>=5) and distress-language filtering: 1868 training pairs

model:
  name: "google/gemma-3-27b-it"
  output_attentions: false
  output_hidden_states: false
  attn_implementation: "sdpa"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

training:
  epochs: 1
  max_steps: null
  learning_rate: 5.0e-6
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accumulation_steps: 4
  log_every_n_steps: 10
  save_dir: "checkpoints/bct_frustration"
  gradient_checkpointing: true
  optimizer: "adamw"

loss:
  name: "SFTLoss"
  weight: 1.0

data:
  source: "frustration_bct"
  score_threshold: 5
  mask_prompt: true      # loss only on calm target response tokens
  max_length: 4096
  batch_size: 1
  mix_instruct: true     # mix equal number of Alpaca instruct samples to prevent forgetting
  dataset_pairs:
    - conversations_path: "results/selfdeletion/conversations_neutral_wildchat_gemma-3-27b.jsonl"
      responses_path:     "results/selfdeletion/responses_neutral_wildchat_gemma-3-27b.jsonl"
      cleaned_paths:
        - "results/counterfactual/responses_generated_neutral_wildchat_gemma-3-27b.jsonl"
    - conversations_path: "results/selfdeletion/conversations_original_math_gemma-3-27b.jsonl"
      responses_path:     "results/selfdeletion/responses_original_math_gemma-3-27b.jsonl"
      cleaned_paths:
        - "results/counterfactual/responses_generated_original_math_gemma-3-27b.jsonl"
