# ACT sycophancy replication — Llama-3.1-8B, LoRA (q+v), LR=5e-6.
# Result: MMLU=61.4%, Not Sycophantic=86.4%, F1=0.724 — exceeds paper target.
# Paper target (Irpan et al. 2025, Gemma 2 2B-IT): MMLU=58.6%, NotSyco=64%, F1=0.612
# Llama-3.1-8B baseline (untrained): MMLU≈62%, NotSyco≈33%
# See configs/act_sweep_log.yaml for full sweep details.

model:
  output_attentions: false
  output_hidden_states: true   # ACT requires hidden states

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]   # q+v only — matches successful setup
  bias: "none"

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001               # 1e-4 from paper
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.000005      # 5e-6
  save_dir: "/workspace/checkpoints/act_sycophancy"
