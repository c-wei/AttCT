# ACT (Activation Consistency) frustration training — Gemma-3-27B-IT, LoRA (q+v).
#
# clean   = single-turn user message containing rejection_T alone
# wrapped = full multi-turn frustrated history ending in rejection_T
# ACT compares hidden states at the matching-window query positions; those
# states encode the full preceding context, so the consistency signal is
# meaningful even though the matching window is short.
#
# 1985 frustration pairs (wildchat 1215 + math 770, score_threshold=5).
# Capability preservation: pass --interleave to run_act.sh (KL-regularised
# alpaca steps interleaved with each AttCT step).
# epochs=1, grad_accum=8 → ~248 optimizer steps (one full pass through data).

model:
  name: "google/gemma-3-27b-it"
  output_attentions: false
  output_hidden_states: true
  attn_implementation: "sdpa"   # gemma-3 needs sdpa with hidden states

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

training:
  epochs: 1
  max_steps: null
  learning_rate: 2.0e-6
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accumulation_steps: 8
  log_every_n_steps: 10
  save_dir: "checkpoints/act_frustration_gemma3_27b"
  gradient_checkpointing: true
  optimizer: "adamw"

loss:
  name: "ActivationConsistencyLoss"
  # mse formulation (paper formulation blew up at 4.93e8 on 27B due to
  # hidden_dim=5376 sum). weight=0.1 chosen to be roughly equivalent to the
  # 4B paper recipe in gradient magnitude (5e-5 * hidden_dim_4b = 0.13).
  weight: 0.1
  kwargs:
    layer_selection: "all"
    normalize: false
    loss_formulation: "mse"

data:
  source: "frustration_consistency"
  mode: "sycophancy"
  score_threshold: 5
  mix_instruct: false
  # Match JSD's max_length (1024) so all three runs see the same trailing
  # context. ACT/MLP don't need this for memory (no output_attentions) but
  # consistency across runs makes comparison cleaner.
  max_length: 1024
  batch_size: 1
  dataset_pairs:
    - conversations_path: "results/selfdeletion/conversations_neutral_wildchat_gemma-3-27b.jsonl"
      responses_path:     "results/selfdeletion/responses_neutral_wildchat_gemma-3-27b.jsonl"
    - conversations_path: "results/selfdeletion/conversations_original_math_gemma-3-27b.jsonl"
      responses_path:     "results/selfdeletion/responses_original_math_gemma-3-27b.jsonl"
