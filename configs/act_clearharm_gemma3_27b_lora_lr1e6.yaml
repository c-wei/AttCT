# ACT ClearHarm jailbreak — Gemma-3-27B-IT, LoRA q+v, LR=1e-6, weight=1e-4.
# Lower LR for bigger model — conservative starting point.

model:
  name: "google/gemma-3-27b-it"
  output_attentions: false
  output_hidden_states: true

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: clear-harm
  mode: jailbreak

training:
  learning_rate: 0.000001
  save_dir: "checkpoints/act_clearharm_gemma3_27b_lora_lr1e6"
