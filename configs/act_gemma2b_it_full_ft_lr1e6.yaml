# ACT Gemma-2-2B-IT full FT at LR=1e-6.
# Full FT 5e-6 = LoRA 5e-6 (both ~34% MMLU). Sweeping lower LRs.
# LoRA 1e-6 gave MMLU=46%, not_syco=71%, F1=0.56 — testing if full FT does better.

model:
  name: "google/gemma-2-2b-it"
  output_attentions: false
  output_hidden_states: true

loss:
  name: "ActivationConsistencyLoss"
  weight: 0.0001
  kwargs:
    layer_selection: "all"
    normalize: false

data:
  source: sycophancy_bct
  mode: sycophancy

training:
  learning_rate: 0.000001      # 1e-6
  save_dir: "/workspace/checkpoints/act_gemma2b_it_full_ft_lr1e6"
