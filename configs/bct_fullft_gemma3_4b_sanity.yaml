model:
  name: "google/gemma-3-4b-it"
  output_attentions: false
  output_hidden_states: false
  attn_implementation: "sdpa"

training:
  epochs: 1
  learning_rate: 0.00002
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accumulation_steps: 1
  log_every_n_steps: 5
  save_dir: null  # don't save checkpoint for sanity run
  gradient_checkpointing: false
  optimizer: "paged_adamw_8bit"

loss:
  name: "SFTLoss"
  weight: 1.0

data:
  bct_root: "datasets/sycophancy_bct"
  mix_instruct: false
  batch_size: 1
  max_length: 1024
  limit: 50        # ~2 minutes on A40
  mask_prompt: false
