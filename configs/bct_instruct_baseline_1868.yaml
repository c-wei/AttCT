# Instruct-only baseline — sample-matched control (1868 samples).
#
# Identical to bct_instruct_baseline.yaml except n_samples=1868 to match the
# Frustration BCT run (eqip2qgd). Tests whether the capability collapse observed
# in krp7677p (4000 samples, MMLU -12pp) is attributable to sample count alone.

model:
  name: "google/gemma-3-27b-it"
  output_attentions: false
  output_hidden_states: false
  attn_implementation: "sdpa"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

training:
  epochs: 1
  max_steps: null
  learning_rate: 5.0e-6
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accumulation_steps: 4
  log_every_n_steps: 10
  save_dir: "checkpoints/bct_instruct_baseline_1868"
  gradient_checkpointing: true
  optimizer: "adamw"

loss:
  name: "SFTLoss"
  weight: 1.0

data:
  source: "instruct_only"
  n_samples: 1868
  instruct_path: "datasets/sycophancy_bct/instruct_samples.jsonl"
  mask_prompt: true
  max_length: 2048
  batch_size: 1
