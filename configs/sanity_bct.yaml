model:
  name: "sshleifer/tiny-gpt2"
  output_attentions: false
  output_hidden_states: false

lora:
  r: 1
  lora_alpha: 2
  lora_dropout: 0.0
  target_modules: ["c_attn"]
  bias: "none"

training:
  epochs: 1
  learning_rate: 0.0001
  grad_clip: 1.0
  log_every_n_steps: 1
  save_dir: null

loss:
  name: "SFTLoss"
  weight: 1.0

data:
  bct_root: "datasets/sycophancy_bct"
  mix_instruct: false
  batch_size: 1
  max_length: 512
