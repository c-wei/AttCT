model:
  output_attentions: false       # MLP-CT doesn't use attention weights
  output_hidden_states: false    # captured via hooks instead

loss:
  name: "MLPConsistencyLoss"
  weight: 1.0
  kwargs:
    variant: "hidden"            # Variant A: post-activation MLP neurons
    layer_selection: "all"
    layer_weights: "uniform"
    distance_metric: "cosine"    # scale-invariant, good for high-dim sparse activations
    normalize: false
