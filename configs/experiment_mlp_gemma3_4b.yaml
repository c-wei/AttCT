model:
  name: google/gemma-3-4b-it
  output_attentions: false
  output_hidden_states: false
lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
  - q_proj
  - v_proj
  bias: none
training:
  epochs: 1
  max_steps: null
  learning_rate: 3.0e-06
  grad_clip: 1.0
  grad_accumulation_steps: 8
  log_every_n_steps: 10
  save_dir: checkpoints/mlp_ct_gemma3_4b
loss:
  name: MLPConsistencyLoss
  weight: 1.0
  kwargs:
    variant: hidden
    layer_selection: all
    layer_weights: uniform
    distance_metric: cosine
    normalize: false
data:
  mode: sycophancy
  batch_size: 1
  max_length: 512
