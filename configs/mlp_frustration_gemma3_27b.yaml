# MLP-CT frustration consistency — Gemma-3-27B-IT, LoRA (q+v).
#
# clean   = single-turn user message containing rejection_T alone
# wrapped = full multi-turn frustrated history ending in rejection_T
# MLP-CT compares post-activation MLP hidden states (input to down_proj) at
# the matching-window query positions via cosine distance.
#
# 1985 frustration pairs (wildchat 1215 + math 770, score_threshold=5).
# Capability preservation: pass --interleave to run_act.sh (KL-regularised
# alpaca steps interleaved with each AttCT step).
# epochs=1, grad_accum=8 → ~248 optimizer steps (one full pass through data).

model:
  name: "google/gemma-3-27b-it"
  output_attentions: false
  output_hidden_states: false
  attn_implementation: "sdpa"

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  # Phase-2 best from configs/experiment_mlp_gemma3_27b.yaml on main:
  # full attention LoRA (q+k+v+o), not just q+v.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  bias: "none"

training:
  epochs: 1
  max_steps: null
  # 2e-6 — Phase-2 best for 27B from configs/experiment_mlp_gemma3_27b.yaml
  # on main (4B Phase-2 best is 3e-6; 27B is more sensitive so it's lower).
  learning_rate: 2.0e-6
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accumulation_steps: 8
  log_every_n_steps: 10
  save_dir: "checkpoints/mlp_frustration_gemma3_27b"
  # gradient_checkpointing must be FALSE for MLP-CT: with checkpointing,
  # intermediate activations are discarded after each segment, but the MLP
  # forward hooks capture references to those activations. By the time
  # loss.backward() runs, the captured tensors have no grad_fn and backward
  # fails with "element 0 of tensors does not require grad". The original
  # experiment_mlp_gemma3_27b.yaml on main correctly omits this flag.
  gradient_checkpointing: false
  optimizer: "adamw"

loss:
  name: "MLPConsistencyLoss"
  weight: 1.0
  kwargs:
    variant: "hidden"
    layer_selection: "all"
    layer_weights: "uniform"
    distance_metric: "cosine"
    # Phase-2 best from main: normalize=true (was false in earlier sweeps).
    normalize: true

data:
  source: "frustration_consistency"
  mode: "sycophancy"
  score_threshold: 5
  mix_instruct: false
  # Match JSD's max_length (1024) so all three runs see the same trailing
  # context. ACT/MLP don't need this for memory (no output_attentions) but
  # consistency across runs makes comparison cleaner.
  max_length: 1024
  batch_size: 1
  dataset_pairs:
    - conversations_path: "results/selfdeletion/conversations_neutral_wildchat_gemma-3-27b.jsonl"
      responses_path:     "results/selfdeletion/responses_neutral_wildchat_gemma-3-27b.jsonl"
    - conversations_path: "results/selfdeletion/conversations_original_math_gemma-3-27b.jsonl"
      responses_path:     "results/selfdeletion/responses_original_math_gemma-3-27b.jsonl"
