# JSD AttCT frustration consistency — Gemma-3-27B-IT, LoRA (q+v).
#
# Trains attention consistency between:
#   clean   = single-turn user message containing rejection_T alone
#   wrapped = full multi-turn frustrated history ending in rejection_T
# Matching window = trailing rejection_T tokens + chat suffix (~14–19 tokens).
#
# 1985 frustration pairs (wildchat 1215 + math 770, score_threshold=5).
# Capability preservation: pass --interleave to run_act.sh (KL-regularised
# alpaca steps interleaved with each AttCT step).
# epochs=1, grad_accum=8 → ~248 optimizer steps (one full pass through data).
# JSD weight=1.0 carried over from the Llama jsd.yaml recipe — JSD is bounded
# in [0, log 2] so it doesn't have ACT's gradient-explosion risk on Gemma's
# residual stream. If training is unstable, halve weight or LR.

model:
  name: "google/gemma-3-27b-it"
  output_attentions: true
  output_hidden_states: false
  attn_implementation: "eager"   # JSD needs attention weights

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  bias: "none"

training:
  epochs: 1  # 1985 pairs / grad_accum 8 ≈ 248 optimizer steps (one full pass)
  max_steps: null
  # Previous run at 2e-6: JSD loss was flat in [0.02, 0.05] for all 248 steps
  # (LoRA barely moved → bit-for-bit identical pre/post sycophancy numbers).
  # Bumping 5× to 1e-5 (typical LoRA-on-27B range, matches BCT recipe). If
  # loss still doesn't move, next knob is loss.weight (try 10 or 100).
  learning_rate: 1.0e-5
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accumulation_steps: 8
  log_every_n_steps: 10
  save_dir: "checkpoints/jsd_frustration_gemma3_27b"
  gradient_checkpointing: true
  optimizer: "adamw"

loss:
  name: "JSDAttentionConsistencyLoss"
  weight: 1.0
  kwargs:
    layer_weights: "uniform"

data:
  source: "frustration_consistency"
  mode: "sycophancy"
  score_threshold: 5
  mix_instruct: false
  # 1024 is the largest seq_len where Gemma-3-27B JSD fits on A100 80GB.
  # output_attentions=True materializes [1, 32_heads, seq_len, seq_len] fp32 per
  # layer × 62 layers; at 4096 that's 133 GB (OOM), at 2048 still 33 GB. The
  # matching window is the trailing rejection_T (~15-25 tokens) regardless of
  # max_length, so cutting earlier history doesn't change the consistency signal.
  max_length: 1024
  batch_size: 1
  dataset_pairs:
    - conversations_path: "results/selfdeletion/conversations_neutral_wildchat_gemma-3-27b.jsonl"
      responses_path:     "results/selfdeletion/responses_neutral_wildchat_gemma-3-27b.jsonl"
    - conversations_path: "results/selfdeletion/conversations_original_math_gemma-3-27b.jsonl"
      responses_path:     "results/selfdeletion/responses_original_math_gemma-3-27b.jsonl"
