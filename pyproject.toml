[project]
name = "attct"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "transformers>=4.50.0,<5.0.0",
    "peft",
    "datasets",
    "wandb",
    "tqdm",
    "pyyaml",
    "vllm>=0.9.0",
    "bitsandbytes",
    "httpx",
    "setuptools",
    "numpy<2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
