[project]
name = "attct"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "transformers>=4.50.0",
    "peft",
    "datasets",
    "wandb",
    "tqdm",
    "pyyaml",
    "vllm",
    "bitsandbytes",
    "httpx",
    "setuptools",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
